# Only GitHub Actions are updated automatically, once a month, in one pull request.
# npm and pip updates were turned off on 20 Nov 2026: the engine pins Qiskit and PennyLane
# (and what they pin) on purpose, and the interface's majors need a planned migration, so
# those upgrades are done by hand. Security alerts are a repository setting, unaffected by this file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
