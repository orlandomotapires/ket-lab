name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: Motor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "engine[dev]"
      - name: Testes do motor e suíte de conteúdo
        run: python -m pytest -q
        working-directory: engine

  app:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app


  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "engine[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: Testes ponta a ponta
        run: npx playwright test
        working-directory: app
        env:
          CI: "1"
          QLP_PYTHON: python
      - name: Testes ponta a ponta (modo hospedado)
        run: npx playwright test -c playwright.hosted.config.ts
        working-directory: app
        env:
          CI: "1"
          QLP_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
