name: CI

# Runs when something lands on main (a push or a merged pull request). Work goes
# branch -> main. Other branches and pull requests get no automatic run; "Run
# workflow" in the Actions tab runs it by hand on any branch.
# A change that touches only the files below (README, docs, screenshots) runs nothing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "docs/**"
      - ".claude/**"
      - ".github/assets/**"
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "engine[dev,hardware]" -c engine/constraints.txt
      - name: Lint (syntax errors, undefined names, unused imports)
        if: matrix.os == 'ubuntu-latest'
        run: ruff check engine
      - name: Type check (mypy, settings in engine/pyproject.toml)
        if: matrix.os == 'ubuntu-latest'
        run: mypy
        working-directory: engine
      - name: Engine tests and content suite
        run: python -m pytest -q
        working-directory: engine

  wasm-build:
    # The browser version of the engine (.claude/docs/web-engine-decision.md): Qiskit for WebAssembly
    # (rebuilt only when build.sh, the patch or the Pyodide pin change) and the staged site files.
    name: Engine in Pyodide (build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: wheel
        uses: actions/cache@v6
        with:
          path: build-wasm/dist
          key: qiskit-wasm-${{ hashFiles('build-wasm/build.sh', 'build-wasm/patches/**', 'build-wasm/package.json') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - if: steps.wheel.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-wasm-${{ hashFiles('build-wasm/build.sh', 'build-wasm/patches/**') }}
      - name: Build the Qiskit WebAssembly wheel
        if: steps.wheel.outputs.cache-hit != 'true'
        run: build-wasm/build.sh
        env:
          PYTHON: python
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-wasm/package-lock.json
      - run: npm ci
        working-directory: build-wasm
      # Pyodide, its packages, the wheels and the lessons, as the site serves them; the test jobs use them.
      - name: Stage the browser engine files
        run: python build-wasm/stage.py
      - uses: actions/upload-artifact@v7
        with:
          name: browser-engine
          path: app/public/browser-engine
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: qiskit-wasm-wheel
          path: build-wasm/dist/*.whl
          retention-days: 30

  wasm-suite:
    name: Engine in Pyodide (test suite)
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: browser-engine
          path: app/public/browser-engine
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-wasm/package-lock.json
      - run: npm ci
        working-directory: build-wasm
      - name: Engine tests and content suite inside Pyodide
        run: node run-engine-tests.mjs
        working-directory: build-wasm

  wasm-browser:
    name: Engine in Pyodide (browser mode)
    needs: wasm-build
    # Pinned: Playwright's --with-deps cannot install its fonts on Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: browser-engine
          path: app/public/browser-engine
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            build-wasm/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: build-wasm
      - name: Browser engine protocol test and every reference solution (Node)
        run: node test-browser-engine.mjs
        working-directory: build-wasm
      # Every reference solution must stay well inside its (browser) time limit: fails above half.
      - name: Lesson times against their limits
        run: node time-lessons.mjs
        working-directory: build-wasm
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: app
      # Chromium, Firefox and WebKit (Safari), plus phone emulation (Pixel 7, iPhone 14).
      # Its own limit, below the job's: a slow run then fails (not cancelled) and the report uploads.
      - name: End-to-end tests (browser mode)
        run: npx playwright test -c playwright.browser.config.ts
        working-directory: app
        timeout-minutes: 40
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: ${{ !success() }}
        with:
          name: playwright-report-browser
          path: app/playwright-report

  app:
    name: Interface
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app


  e2e:
    name: End to end (Playwright)
    # Pinned: Playwright's --with-deps cannot install its fonts on Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # The hardware extra: the hardware dialog test sends a circuit through the simulated IBM service.
      - run: pip install -e "engine[dev,hardware]" -c engine/constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - name: End-to-end tests
        run: npx playwright test
        working-directory: app
        env:
          CI: "1"
          KET_LAB_PYTHON: python
      - name: End-to-end tests (hosted mode)
        run: npx playwright test -c playwright.hosted.config.ts
        working-directory: app
        env:
          CI: "1"
          KET_LAB_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report

  images:
    name: Docker images build (${{ matrix.arch }})
    # The local image is published for both architectures (image.yml); arm64 runs on GitHub's
    # native ARM runner here, so the build and the smoke test are real, not emulated.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Local single-user image
        run: docker build -f deploy/Dockerfile.local -t ket-lab-local .
      - name: Hosted images
        if: matrix.arch == 'amd64'
        run: |
          docker build -f deploy/Dockerfile.engine -t ket-lab-engine .
          docker build -f deploy/Dockerfile.web -t ket-lab-web .
      - name: The local image starts and serves the interface
        run: |
          docker run -d --name ket-lab -p 8080:8080 ket-lab-local
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs ket-lab
          exit 1
