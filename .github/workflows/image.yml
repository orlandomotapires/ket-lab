name: Image

# Publishes the "just use it" image (deploy/Dockerfile.local) to the GitHub Container Registry.
# Runs when a v* tag is created or manually (Actions > Image > Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/orlandomotapires/ket-lab
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.local
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
