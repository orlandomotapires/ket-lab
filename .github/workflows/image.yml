name: Image

# Publishes the "just use it" image (deploy/Dockerfile.local) to the GitHub Container Registry,
# for amd64 and arm64 under one tag.
# Runs when a v* tag is created or manually (Actions > Image > Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # arm64 (Apple Silicon, ARM Linux) is built under emulation; the interface stage of the
      # Dockerfile runs natively, so only the Python stage is emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/orlandomotapires/ket-lab
          tags: |
            type=raw,value=latest
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.local
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
