name: Pages

# Publishes Ket Lab to GitHub Pages as a static site: the engine runs in the learner's
# browser (Pyodide), so there is no server. Plan: .claude/docs/web-engine-decision.md.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Same cache as CI: the wheel is rebuilt only when build.sh, the patch or the Pyodide pin change.
      - id: wheel
        uses: actions/cache@v4
        with:
          path: build-wasm/dist
          key: qiskit-wasm-${{ hashFiles('build-wasm/build.sh', 'build-wasm/patches/**', 'build-wasm/package.json') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - if: steps.wheel.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-wasm-${{ hashFiles('build-wasm/build.sh', 'build-wasm/patches/**') }}
      - name: Build the Qiskit WebAssembly wheel
        if: steps.wheel.outputs.cache-hit != 'true'
        run: build-wasm/build.sh
        env:
          PYTHON: python
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            build-wasm/package-lock.json
            app/package-lock.json
      - run: npm ci
        working-directory: build-wasm
      - name: Stage the browser engine files
        run: python build-wasm/stage.py
      # The lessons must pass in the browser engine before anything is published.
      - name: Every reference solution through the browser engine
        run: node test-browser-engine.mjs
        working-directory: build-wasm
      - run: npm ci
        working-directory: app
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the interface (browser engine)
        run: npm run build
        working-directory: app
        env:
          VITE_ENGINE: browser
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
