name: Release

# Creates the GitHub Release for a v* tag, with that version's section of CHANGELOG.md as
# its notes. The same tag makes image.yml publish the Docker image. To release X.Y.Z:
#   1. In CHANGELOG.md, rename "## Unreleased" to "## X.Y.Z".
#   2. Set the version in package.json, app/package.json, engine/pyproject.toml and
#      engine/ket_lab_engine/__init__.py, then run `npm install --package-lock-only` at the
#      root and in app/ to update both lockfiles.
#   3. Merge that through a pull request, then on main: git tag vX.Y.Z && git push origin vX.Y.Z
#   4. Once the image is published, update the Docker commands on the wiki's Running locally page.
#      (The README's scripts/run-docker.sh takes the latest release by itself.)
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Ket Lab $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
