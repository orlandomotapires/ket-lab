name: Release

# Creates the GitHub Release for a v* tag, with that version's section of CHANGELOG.md as
# its notes. To release: rename "## Unreleased" to "## X.Y.Z" in CHANGELOG.md, commit on
# main, then `git tag vX.Y.Z && git push origin vX.Y.Z`. The same tag makes image.yml
# publish the Docker image.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Ket Lab $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
