<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none' stroke='%234a7fd0'%3E%3Cpath d='M15.15 21.86 L13 5 L26.3 14.75 A22 22 0 0 1 37.7 14.75 L51 5 L48.85 21.86 A22 22 0 1 1 15.15 21.86 Z' stroke-width='4.6' stroke-linejoin='round'/%3E%3Cpath d='M10 36 A22 7 0 0 0 54 36' stroke-width='3' opacity='.55'/%3E%3Ccircle cx='24' cy='28' r='4.4' fill='%234a7fd0' stroke='none'/%3E%3Cpath d='M36.5 29 Q40 25.5 43.5 29' stroke-width='3.6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Ket Lab</title>
    <script>
      // Applies the theme before first paint to avoid flashing.
      (function () {
        var saved = null;
        // "qlp.theme": the key before the rename to Ket Lab (src/lib/migrateStorage.ts moves it).
        try { saved = localStorage.getItem("ket-lab.theme") || localStorage.getItem("qlp.theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
