<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%2323568a' stroke-width='1.5'/%3E%3Cellipse cx='8' cy='8' rx='6.5' ry='2.4' fill='none' stroke='%2323568a'/%3E%3C/svg%3E" />
    <title>Quantum Learning Platform</title>
    <script>
      // Applies the theme before first paint to avoid flashing.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("qlp.theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
