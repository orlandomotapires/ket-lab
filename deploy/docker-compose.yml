# Uso: SITE_ORIGIN=https://quantum.exemplo.org docker compose -f deploy/docker-compose.yml up --build
# (rode da raiz do repositório). Veja deploy/README.md antes de abrir ao público.
services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    command: ["--workers", "4", "--max-connections", "200", "--allow-origin", "${SITE_ORIGIN:?defina SITE_ORIGIN}"]
    # Endurecimento: o código dos alunos roda aqui.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
    # Com o gVisor instalado no host, descomente para isolar o kernel:
    # runtime: runsc
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:8080"
    depends_on: [engine]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks: [internal, public]
    restart: unless-stopped

networks:
  # O motor não tem saída para a internet: só o proxy fala com ele.
  internal:
    internal: true
  public: {}
