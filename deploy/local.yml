# Run the lab from this checkout, without installing Python or Node. From the repository root:
#   docker compose -f deploy/local.yml up --build
# Then open http://localhost:8080. Progress is kept in the ket-lab-progress volume.
# To run the published image instead, use scripts/run-docker.sh.
services:
  ket-lab:
    image: ket-lab:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local
    # Only this machine can reach the port.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ket-lab-progress:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped

volumes:
  ket-lab-progress:
