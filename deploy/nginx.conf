# Up to 4 simultaneous engine connections per IP address.
limit_conn_zone $binary_remote_addr zone=engine_per_ip:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Security headers for the interface.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header here replaces the server-level ones, so they are repeated.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    # Engine WebSocket. The browser's Origin is forwarded: the engine only accepts the site's own.
    location /engine {
        limit_conn engine_per_ip 4;
        proxy_pass http://engine:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        client_max_body_size 1m;
    }
}
