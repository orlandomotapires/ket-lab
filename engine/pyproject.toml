[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ket-lab-engine"
version = "0.3.0"
description = "Local scientific engine of Ket Lab"
requires-python = ">=3.11"
license = { text = "MIT" }
# Versions are pinned on purpose: the Qiskit API changes between major versions and
# the lessons depend on it. Update here and run the content suite.
dependencies = [
    "qiskit==2.6.2",
    # Track 3: variational circuits, gradients, chemistry (dhf, no PySCF) and noise (default.mixed).
    "pennylane==0.45.1",
    "numpy>=2.2,<3",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20", "ruff>=0.6", "mypy>=2.4"]
# Execution on real IBM quantum computers (roadmap item 4.2).
hardware = ["qiskit-ibm-runtime>=0.52,<0.53"]

[project.scripts]
ket-lab-engine = "ket_lab_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["ket_lab_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["ket_lab_engine"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# These libraries ship without type information (no py.typed marker).
module = ["qiskit.*", "qiskit_ibm_runtime.*", "pennylane.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports and variables. No formatting rules.
select = ["E9", "F"]
